services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: layby
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - layby-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d layby"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  layby-postgres:
